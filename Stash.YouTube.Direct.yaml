# 专用配置：Stash 只负责 YouTube 去广告，所有流量直连，不使用任何代理节点。
# 适合设备所在网络已经完成科学上网、不需要 Stash 再代理的场景。
mode: rule
log-level: info

# 没有配置 proxies / proxy-groups；唯一规则是 MATCH,DIRECT。
rules:
  - 'MATCH,DIRECT'

# 使用设备当前网络的系统 DNS（通常是路由器的 DNS）。
dns:
  enable: true
  default-nameserver:
    - 223.5.5.5
    - system
  nameserver:
    - system

http:
  mitm:
    - 'youtubei.googleapis.com'
    - '*.googlevideo.com'

  script:
    - name: 'YouTubeEnhanceResponse'
      type: response
      match: '^https:\/\/youtubei\.googleapis\.com\/(youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch|log_event|config))(\?(.*))?$'
      require-body: true
      binary-mode: true
      max-size: 5242880
      timeout: 30

    - name: 'YouTubeEnhanceRequest'
      type: request
      match: '^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&ack.*'
      require-body: true
      binary-mode: true
      max-size: 1048576
      timeout: 10

    - name: 'YouTubeEnhanceRequest'
      type: request
      match: '^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/log_event'
      timeout: 10

script-providers:
  'YouTubeEnhanceResponse':
    url: 'https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js'
    interval: 86400
  'YouTubeEnhanceRequest':
    url: 'https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js'
    interval: 86400
